<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f2">
    <meta name="description" content="FFFilm 隐私政策与技术支持。">
    <title>FFFilm / 支持</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="preload" href="fonts/display-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <!-- Runs before first paint so the theme never flashes and script-only controls keep their space. -->
    <script>
      (function (root) {
        root.dataset.js = "";
        try {
          var theme = localStorage.getItem("fffilm-theme");
          if (theme) root.dataset.theme = theme;
        } catch (_) {}
      })(document.documentElement);
    </script>
    <script src="site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <!-- Signature element: the sprocket rail frames every page of the sheet. -->
    <aside class="rail" aria-hidden="true"></aside>

    <div class="page">
      <header class="site-header">
        <div class="wrap">
          <a class="brand" href="index.html" aria-label="FFFilm 支持首页">
            <img class="brand-mark" src="icons/brand-mark.png" alt="" width="32" height="32">
            <span class="brand-name">FFFilm <em>/ support</em></span>
          </a>
          <div class="site-tools">
            <nav class="site-nav" aria-label="主要导航">
              <a href="support.html">技术支持</a>
              <a href="privacy.html">隐私政策</a>
            </nav>
            <button class="theme-toggle needs-js" type="button" aria-pressed="false" aria-label="暗房模式">
              <span class="theme-lamp" aria-hidden="true"></span>
              <span class="theme-label" aria-hidden="true">暗房</span>
            </button>
          </div>
        </div>
      </header>

      <main id="main">
        <div class="wrap">
          <section class="title-block" aria-labelledby="page-title">
            <div class="title-copy">
              <h1 id="page-title">支持资料</h1>
            </div>
            <aside class="meta-block" aria-label="页面信息">
              <dl>
                <div><dt>更新日期</dt><dd>2026.11.01</dd></div>
                <div><dt>适用范围</dt><dd>iPhone · iPad · Mac</dd></div>
              </dl>
            </aside>
          </section>

          <section class="strip" aria-label="资料入口">
            <div class="strip-inner">
              <a class="frame-card" href="support.html">
                <span class="frame-title">技术支持</span>
                <span class="frame-desc">数据率、存储、快门、负片预览与胶片切片的用法和常见问题。</span>
                <svg class="frame-arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 14 14 6M7 6h7v7"/></svg>
              </a>
              <a class="frame-card" href="privacy.html">
                <span class="frame-title">隐私政策</span>
                <span class="frame-desc">应用处理哪些数据、什么留在本地、什么不会上传。</span>
                <svg class="frame-arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 14 14 6M7 6h7v7"/></svg>
              </a>
            </div>
          </section>

        </div>
      </main>

      <footer class="site-footer">
        <div class="wrap">
          <!-- 版权主体为朱煜天；FFFilm 保留为产品名称。 -->
          <p>© 2026 朱煜天 · FFFilm</p>
        </div>
      </footer>
    </div>
  </body>
</html>
